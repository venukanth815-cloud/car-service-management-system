<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>AutoElite | Profile</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:rgba(201,168,76,0.12);--dark:#0A0A0B;--dark-2:#111114;--dark-3:#1A1A1F;--dark-4:#242429;--glass-border:rgba(255,255,255,0.07);--text:#F0EDE8;--text-dim:#8A8680;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
        nav{background:var(--dark-2);border-bottom:1px solid var(--glass-border);padding:0 40px;height:65px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
        .nav-logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);text-decoration:none;}
        .nav-links{display:flex;align-items:center;gap:4px;}
        .nav-links a{color:var(--text-dim);text-decoration:none;font-size:13px;padding:7px 14px;border-radius:8px;transition:all 0.2s;}
        .nav-links a:hover,.nav-links a.active{color:var(--gold);background:var(--gold-dim);}
        .logout-btn{background:none;border:none;color:var(--text-dim);font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
        .logout-btn:hover{color:#ff6b6b;background:rgba(239,68,68,0.08);}
        .page-wrap{max-width:780px;margin:40px auto;padding:0 20px 60px;}
        .alert{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:10px;font-size:13px;margin-bottom:24px;}
        .alert-success{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);color:#34d399;}
        .alert-error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171;}
        .profile-header{display:flex;align-items:center;gap:24px;background:var(--dark-2);border:1px solid var(--glass-border);border-radius:18px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden;}
        .profile-header::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:var(--gold-dim);pointer-events:none;}
        .avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:32px;color:#000;font-weight:700;flex-shrink:0;position:relative;z-index:1;}
        .profile-meta{flex:1;position:relative;z-index:1;}
        .profile-name{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:4px;}
        .profile-email{font-size:14px;color:var(--text-dim);}
        .profile-role{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.25);color:var(--gold);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:50px;}
        .section-card{background:var(--dark-2);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
        .section-header{padding:18px 24px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:10px;}
        .section-header i{color:var(--gold);font-size:14px;}
        .section-header h3{font-size:14px;font-weight:600;}
        .section-body{padding:24px;}
        .field{margin-bottom:18px;}
        .field label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
        .input-wrap{position:relative;}
        .input-wrap i.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;}
        .input-wrap input{width:100%;padding:12px 40px 12px 40px;background:var(--dark-3);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:all 0.3s;}
        .input-wrap input:focus{border-color:var(--gold);background:var(--dark-4);box-shadow:0 0 0 3px rgba(201,168,76,0.08);}
        .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;transition:color 0.2s;}
        .eye-btn:hover{color:var(--gold);}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .btn-save{padding:12px 28px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#000;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 0.3s;}
        .btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,168,76,0.3);}
        .info-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;}
        .info-row:last-child{border-bottom:none;}
        .info-label{color:var(--text-dim);display:flex;align-items:center;gap:10px;font-size:13px;}
        .info-label i{color:var(--gold);width:14px;}
        .info-value{font-weight:500;}
        .status-active{display:flex;align-items:center;gap:6px;color:#34d399;font-size:13px;}
        .security-note{display:flex;align-items:center;gap:10px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:10px;padding:14px 18px;font-size:12px;color:rgba(52,211,153,0.8);margin-top:20px;}
    </style>
</head>
<body>
<nav>
    <a href="/home" class="nav-logo">AutoElite</a>
    <div class="nav-links">
        <a href="/home">Home</a>
        <span sec:authorize="hasRole('USER')"><a href="/book">Book Service</a><a href="/my-bookings">My Bookings</a><a href="/payment">Payment</a></span>
        <span sec:authorize="hasRole('ADMIN')"><a href="/admin/bookings">All Bookings</a><a href="/admin/users">Users</a></span>
        <a href="/dashboard">Dashboard</a>
        <a href="/profile" class="active">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket" style="margin-right:5px;"></i>Logout</button>
        </form>
    </div>
</nav>
<div class="page-wrap">
    <div th:if="${success}" class="alert alert-success"><i class="fa-solid fa-circle-check"></i><span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-error"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${error}"></span></div>

    <div class="profile-header">
        <div class="avatar" th:text="${customer!=null?customer.name.substring(0,1).toUpperCase():'U'}">U</div>
        <div class="profile-meta">
            <div class="profile-name" th:text="${customer!=null?customer.name:'User'}"></div>
            <div class="profile-email" th:text="${customer!=null?customer.email:''}"></div>
            <div class="profile-role"><i class="fa-solid fa-shield-halved"></i><span th:text="${customer!=null?customer.role:'USER'}"></span></div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-header"><i class="fa-regular fa-id-card"></i><h3>Account Information</h3></div>
        <div class="section-body">
            <div class="info-row"><div class="info-label"><i class="fa-regular fa-user"></i>Full Name</div><div class="info-value" th:text="${customer!=null?customer.name:'N/A'}"></div></div>
            <div class="info-row"><div class="info-label"><i class="fa-regular fa-envelope"></i>Email</div><div class="info-value" th:text="${customer!=null?customer.email:'N/A'}"></div></div>
            <div class="info-row"><div class="info-label"><i class="fa-solid fa-shield-halved"></i>Role</div><div class="info-value" th:text="${customer!=null?customer.role:'USER'}"></div></div>
            <div class="info-row"><div class="info-label"><i class="fa-solid fa-circle-dot"></i>Status</div><div class="status-active"><i class="fa-solid fa-circle" style="font-size:8px;"></i>Active</div></div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-header"><i class="fa-solid fa-pen-to-square"></i><h3>Edit Name</h3></div>
        <div class="section-body">
            <form th:action="@{/profile/update-name}" method="post">
                <div class="field">
                    <label>Full Name</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user icon"></i>
                        <input type="text" name="name" th:value="${customer!=null?customer.name:''}" placeholder="Enter your full name" required>
                    </div>
                </div>
                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i>Save Name</button>
            </form>
        </div>
    </div>

    <div class="section-card">
        <div class="section-header"><i class="fa-solid fa-lock"></i><h3>Change Password</h3></div>
        <div class="section-body">
            <form th:action="@{/profile/update-password}" method="post">
                <div class="field">
                    <label>Current Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" id="cp" name="currentPassword" placeholder="Enter current password" required>
                        <button type="button" class="eye-btn" onclick="toggle('cp','e1')"><i class="fa-regular fa-eye" id="e1"></i></button>
                    </div>
                </div>
                <div class="two-col">
                    <div class="field">
                        <label>New Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-key icon"></i>
                            <input type="password" id="np" name="newPassword" placeholder="New password" required minlength="6">
                            <button type="button" class="eye-btn" onclick="toggle('np','e2')"><i class="fa-regular fa-eye" id="e2"></i></button>
                        </div>
                    </div>
                    <div class="field">
                        <label>Confirm New Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock-open icon"></i>
                            <input type="password" id="cnp" name="confirmPassword" placeholder="Repeat new password" required minlength="6">
                            <button type="button" class="eye-btn" onclick="toggle('cnp','e3')"><i class="fa-regular fa-eye" id="e3"></i></button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-save" onclick="return checkPwd()"><i class="fa-solid fa-shield-check"></i>Update Password</button>
            </form>
        </div>
    </div>

    <div class="security-note"><i class="fa-solid fa-lock"></i>Your account is secured with BCrypt encryption. AutoElite never stores plain text passwords.</div>
</div>
<script>
function toggle(id,iconId){const i=document.getElementById(id),ic=document.getElementById(iconId);i.type=i.type==='password'?'text':'password';ic.className=i.type==='password'?'fa-regular fa-eye':'fa-regular fa-eye-slash';}
function checkPwd(){if(document.getElementById('np').value!==document.getElementById('cnp').value){alert('New passwords do not match!');return false;}return true;}
</script>
</body>
</html>
