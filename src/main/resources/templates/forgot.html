<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AutoElite | Forgot Password</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #C9A84C; --gold-light: #E8C96A;
            --gold-dim: rgba(201,168,76,0.12);
            --dark: #0A0A0B; --dark-2: #111114; --dark-3: #1A1A1F; --dark-4: #242429;
            --glass-border: rgba(255,255,255,0.07);
            --text: #F0EDE8; --text-dim: #8A8680;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark); color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 60%);
        }
        .card {
            width: 420px;
            background: var(--dark-2);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 44px;
            animation: fadeUp 0.5s ease both;
        }
        .icon-wrap {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: var(--gold-dim);
            border: 1px solid rgba(201,168,76,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--gold);
            margin-bottom: 24px;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 26px; margin-bottom: 6px;
        }
        .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; line-height: 1.6; }

        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
        .input-wrap input {
            width: 100%; padding: 13px 14px 13px 40px;
            background: var(--dark-3); border: 1px solid var(--glass-border);
            border-radius: 10px; color: var(--text); font-size: 14px;
            font-family: 'DM Sans', sans-serif; outline: none; transition: all 0.3s;
        }
        .input-wrap input:focus { border-color: var(--gold); background: var(--dark-4); box-shadow: 0 0 0 3px rgba(201,168,76,0.08); }

        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; font-family: 'DM Sans', sans-serif;
            cursor: pointer; margin-top: 4px; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(201,168,76,0.3); }

        .msg-success {
            display: flex; align-items: flex-start; gap: 10px;
            background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
            border-radius: 10px; padding: 14px; margin-bottom: 20px;
            font-size: 13px; color: #34d399; line-height: 1.5;
        }
        .msg-error {
            display: flex; align-items: center; gap: 10px;
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px; padding: 14px; margin-bottom: 20px;
            font-size: 13px; color: #f87171;
        }
        .back-link { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-dim); }
        .back-link a { color: var(--gold); text-decoration: none; font-weight: 500; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap"><i class="fa-solid fa-key"></i></div>
    <div class="title">Forgot Password?</div>
    <p class="sub">No worries. Enter your email and we'll send you a secure reset link.</p>

    <div th:if="${message}" class="msg-success">
        <i class="fa-solid fa-circle-check" style="margin-top:1px;"></i>
        <span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="msg-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot}" method="post">
        <div class="field">
            <label>Email Address</label>
            <div class="input-wrap">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fa-solid fa-paper-plane"></i> Send Reset Link
        </button>
    </form>

    <div class="back-link">
        Remembered your password? <a href="/login">Sign in</a>
    </div>
</div>
</body>
</html>
