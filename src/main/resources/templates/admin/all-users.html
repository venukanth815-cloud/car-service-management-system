<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AutoElite | All Users</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --gold:#C9A84C; --gold-light:#E8C96A; --gold-dim:rgba(201,168,76,0.12); --dark:#0A0A0B; --dark-2:#111114; --dark-3:#1A1A1F; --dark-4:#242429; --glass-border:rgba(255,255,255,0.07); --text:#F0EDE8; --text-dim:#8A8680; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }
        nav { background:var(--dark-2); border-bottom:1px solid var(--glass-border); padding:0 40px; height:65px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .nav-logo { font-family:'Playfair Display',serif; font-size:20px; color:var(--gold); text-decoration:none; }
        .nav-links { display:flex; align-items:center; gap:4px; }
        .nav-links a { color:var(--text-dim); text-decoration:none; font-size:13px; padding:7px 14px; border-radius:8px; transition:all 0.2s; }
        .nav-links a:hover, .nav-links a.active { color:var(--gold); background:var(--gold-dim); }
        .logout-btn { background:none; border:none; color:var(--text-dim); font-size:13px; padding:7px 14px; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
        .logout-btn:hover { color:#ff6b6b; background:rgba(239,68,68,0.08); }

        .page-wrap { max-width:1100px; margin:0 auto; padding:40px; }
        .page-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; }
        .page-eyebrow { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
        .page-title { font-family:'Playfair Display',serif; font-size:30px; }
        .page-sub { font-size:13px; color:var(--text-dim); margin-top:4px; }

        .summary-card { background:var(--dark-2); border:1px solid var(--glass-border); border-radius:14px; padding:20px 24px; margin-bottom:24px; display:flex; align-items:center; gap:16px; }
        .summary-icon { width:48px; height:48px; border-radius:12px; background:var(--gold-dim); border:1px solid rgba(201,168,76,0.2); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:20px; }
        .summary-label { font-size:12px; color:var(--text-dim); }
        .summary-value { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--gold); }

        .table-section { background:var(--dark-2); border:1px solid var(--glass-border); border-radius:16px; overflow:hidden; }
        .table-header { padding:18px 24px; border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center; }
        .table-title { font-size:15px; font-weight:600; }
        .table-badge { background:var(--gold-dim); border:1px solid rgba(201,168,76,0.2); color:var(--gold); font-size:11px; padding:4px 10px; border-radius:50px; }
        table { width:100%; border-collapse:collapse; }
        thead tr { background:var(--dark-3); }
        th { padding:13px 20px; text-align:left; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); font-weight:500; }
        td { padding:16px 20px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
        tbody tr:hover { background:rgba(255,255,255,0.02); }
        tbody tr:last-child td { border-bottom:none; }

        .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-light)); display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:#000; font-size:14px; margin-right:10px; vertical-align:middle; }

        .role-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:50px; font-size:11px; font-weight:600; letter-spacing:0.5px; }
        .role-admin { background:rgba(201,168,76,0.12); color:var(--gold); border:1px solid rgba(201,168,76,0.25); }
        .role-user  { background:rgba(96,165,250,0.1);  color:#60a5fa; border:1px solid rgba(96,165,250,0.2); }

        .btn-delete { padding:7px 14px; background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.2); border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; text-decoration:none; display:inline-flex; align-items:center; gap:5px; transition:all 0.2s; }
        .btn-delete:hover { background:#ef4444; color:white; }

        .empty-state { text-align:center; padding:60px; color:var(--text-dim); }
    </style>
</head>
<body>
<nav>
    <a href="/home" class="nav-logo">AutoElite</a>
    <div class="nav-links">
        <a href="/admin/bookings">All Bookings</a>
        <a href="/admin/users" class="active">Users</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket" style="margin-right:5px;"></i>Logout</button>
        </form>
    </div>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <div>
            <div class="page-eyebrow">Admin Panel</div>
            <div class="page-title">All Users</div>
            <div class="page-sub">View and manage all registered customers</div>
        </div>
    </div>

    <!-- SUMMARY -->
    <div class="summary-card">
        <div class="summary-icon"><i class="fa-solid fa-users"></i></div>
        <div>
            <div class="summary-label">Total Registered Users</div>
            <div class="summary-value" th:text="${users.size()}">0</div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-section">
        <div class="table-header">
            <div class="table-title">Registered Customers</div>
            <div class="table-badge" th:text="${users.size()} + ' users'">0 users</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u, stat : ${users}">
                    <td style="color:var(--text-dim);font-size:12px;" th:text="${u.id}"></td>
                    <td>
                        <span class="avatar" th:text="${u.name.substring(0,1).toUpperCase()}">U</span>
                        <span th:text="${u.name}"></span>
                    </td>
                    <td style="color:var(--text-dim);" th:text="${u.email}"></td>
                    <td>
                        <span th:if="${u.role == 'ADMIN'}" class="role-badge role-admin">
                            <i class="fa-solid fa-shield-halved" style="font-size:10px;"></i> ADMIN
                        </span>
                        <span th:if="${u.role == 'USER'}" class="role-badge role-user">
                            <i class="fa-regular fa-user" style="font-size:10px;"></i> USER
                        </span>
                    </td>
                    <td>
                        <a th:if="${u.role != 'ADMIN'}"
                           th:href="@{'/admin/users/delete/' + ${u.id}}"
                           class="btn-delete"
                           onclick="return confirm('Delete this user? This cannot be undone.')">
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </a>
                        <span th:if="${u.role == 'ADMIN'}" style="color:var(--text-dim);font-size:12px;">
                            <i class="fa-solid fa-lock"></i> Protected
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${users.isEmpty()}" class="empty-state">
            <i class="fa-regular fa-user" style="font-size:30px;display:block;margin-bottom:10px;"></i>
            No users registered yet
        </div>
    </div>
</div>
</body>
</html>
