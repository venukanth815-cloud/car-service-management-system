<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AutoElite | Reset Password</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #C9A84C; --gold-light: #E8C96A;
            --gold-dim: rgba(201,168,76,0.12);
            --dark: #0A0A0B; --dark-2: #111114; --dark-3: #1A1A1F; --dark-4: #242429;
            --glass-border: rgba(255,255,255,0.07);
            --text: #F0EDE8; --text-dim: #8A8680;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark); color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 60%);
        }
        .card {
            width: 420px;
            background: var(--dark-2);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 44px;
            animation: fadeUp 0.5s ease both;
        }
        .icon-wrap {
            width: 60px; height: 60px; border-radius: 16px;
            background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--gold); margin-bottom: 24px;
        }
        .title { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 6px; }
        .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; }

        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-wrap i.icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
        .input-wrap input {
            width: 100%; padding: 13px 40px 13px 40px;
            background: var(--dark-3); border: 1px solid var(--glass-border);
            border-radius: 10px; color: var(--text); font-size: 14px;
            font-family: 'DM Sans', sans-serif; outline: none; transition: all 0.3s;
        }
        .input-wrap input:focus { border-color: var(--gold); background: var(--dark-4); box-shadow: 0 0 0 3px rgba(201,168,76,0.08); }
        .eye-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; transition: color 0.2s; }
        .eye-btn:hover { color: var(--gold); }

        .strength-bars { display: flex; gap: 4px; margin-top: 6px; }
        .bar { height: 3px; flex: 1; border-radius: 2px; background: var(--dark-4); transition: background 0.3s; }
        .bar.weak { background: #ef4444; }
        .bar.medium { background: #f59e0b; }
        .bar.strong { background: #10b981; }

        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; font-family: 'DM Sans', sans-serif;
            cursor: pointer; margin-top: 10px; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(201,168,76,0.3); }
        .back-link { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-dim); }
        .back-link a { color: var(--gold); text-decoration: none; font-weight: 500; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap"><i class="fa-solid fa-lock-open"></i></div>
    <div class="title">Reset Password</div>
    <p class="sub">Create a new strong password for your account</p>

    <form th:action="@{/reset}" method="post">
        <!-- ✅ CRITICAL: token field -->
        <input type="hidden" name="token" th:value="${token}">

        <div class="field">
            <label>New Password</label>
            <div class="input-wrap">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="newPwd" name="password" placeholder="Create new password" required oninput="checkStr(this.value)">
                <button type="button" class="eye-btn" onclick="toggle('newPwd','eye1')"><i class="fa-regular fa-eye" id="eye1"></i></button>
            </div>
            <div class="strength-bars">
                <div class="bar" id="b1"></div>
                <div class="bar" id="b2"></div>
                <div class="bar" id="b3"></div>
            </div>
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <div class="input-wrap">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="confPwd" placeholder="Repeat new password" required>
                <button type="button" class="eye-btn" onclick="toggle('confPwd','eye2')"><i class="fa-regular fa-eye" id="eye2"></i></button>
            </div>
        </div>

        <button type="submit" class="btn-primary" onclick="return validate()">
            <i class="fa-solid fa-shield-check"></i> Update Password
        </button>
    </form>

    <div class="back-link"><a href="/login"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>Back to Login</a></div>
</div>
<script>
function toggle(id, iconId) {
    const input = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') { input.type = 'text'; icon.className = 'fa-regular fa-eye-slash'; }
    else { input.type = 'password'; icon.className = 'fa-regular fa-eye'; }
}
function checkStr(val) {
    const bars = ['b1','b2','b3'].map(id => document.getElementById(id));
    bars.forEach(b => b.className = 'bar');
    if (val.length > 4) bars[0].classList.add('weak');
    if (val.length > 7) bars[1].classList.add('medium');
    if (val.length > 10 && /[A-Z]/.test(val) && /[0-9]/.test(val)) bars[2].classList.add('strong');
}
function validate() {
    if (document.getElementById('newPwd').value !== document.getElementById('confPwd').value) {
        alert('Passwords do not match!'); return false;
    }
    return true;
}
</script>
</body>
</html>
